[package]
name = "umbra"
version = "0.1.0"
edition = "2024"
description = "Ultra-minimal, lightweight animated dark wallpaper engine for Windows, macOS, and Linux"
license = "MIT"
repository = "https://github.com/HamidRezaAshkiyan/umbra"
keywords = ["wallpaper", "engine", "dark", "minimal", "wgpu"]

[dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
tray-icon = "0.19"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
